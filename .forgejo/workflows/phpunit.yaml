name: phpunit

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: FreeBSD
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP + PHPUnit
        run: |
          doas pkg install -y php84 php84-curl php84-ctype php84-filter php84-mbstring phpunit11-php84 || \
          doas pkg install -y php84 php84-curl php84-ctype php84-filter php84-mbstring phpunit11
      - name: Run PHPUnit
        run: phpunit --configuration phpunit.xml
